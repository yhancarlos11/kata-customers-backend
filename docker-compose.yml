services:
  db:
    image: postgres:16
    profiles: ["prod"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customersdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["dev"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      JWT_SECRET_DEV: ${JWT_SECRET_DEV:?JWT_SECRET_DEV is required}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

  frontend-dev:
    build:
      context: ../kata-customers-frontend
      dockerfile: Dockerfile
      args:
        BUILD_TARGET: dev
    profiles: ["dev"]
    depends_on:
      - app-dev
    ports:
      - "4200:80"
    volumes:
      - ../kata-customers-frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["prod"]
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-customersdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET_PROD: ${JWT_SECRET_PROD:?JWT_SECRET_PROD is required}
    ports:
      - "9090:9090"

  frontend:
    build:
      context: ../kata-customers-frontend
      dockerfile: Dockerfile
      args:
        BUILD_TARGET: prod
    profiles: ["prod"]
    depends_on:
      - app
    ports:
      - "4201:80"

volumes:
  postgres_data:
